name: JaCoCo

on:
  push:
  workflow_dispatch: # wird auch vom DevContainer-Release fuer den Update-PR gestartet

permissions:
  contents: read
  packages: read # zum Pullen des DevContainer-Images aus der GHCR

jobs:
  devcontainer:
    uses: ./.github/workflows/devcontainer-image.yml

  test:
    needs: devcontainer
    runs-on: ubuntu-latest
    # Tests laufen im eigenen DevContainer-Image (Java 25 + Gradle) aus der GHCR
    container:
      image: ${{ needs.devcontainer.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Run Tests and generate JaCoCo report
      - name: Run Tests and generate JaCoCo report
        run: ./gradlew clean test jacocoTestReport

      # Upload JaCoCo report
      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: build/reports/jacoco/test/html/
          if-no-files-found: error

      # Upload test results
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: build/reports/tests/test/
