name: Infrastruktur (OpenTofu)

# Erstellt/aendert/entfernt die EC2-Infrastruktur in infra/ (siehe docs/iac.md).
# Startet NUR manuell, nie bei einem Push: Die AWS-Learner-Lab-Zugangsdaten sind
# temporaer (Access Key + Secret + Session Token) und laufen nach wenigen Stunden ab,
# darum braucht jeder Lauf frisch eingetragene Secrets (siehe docs/deployment.md,
# Secrets-Konzept). Das App-Deployment (deploy.yml) ist bewusst davon getrennt und
# braucht diese Secrets nicht.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "tofu-Aktion"
        required: true
        type: choice
        options: [plan, apply, destroy]
        default: plan

jobs:
  tofu:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      # terraform.tfvars ist bewusst nicht committet - die unkritischen Werte kommen
      # in CI aus GitHub-Variables (siehe docs/deployment.md, Secrets-Konzept):
      TF_VAR_frontend_bucket: ${{ vars.S3_BUCKET_FRONTEND }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: OpenTofu installieren
        uses: opentofu/setup-opentofu@v1

      - name: tofu init
        run: tofu init

      - name: tofu validate
        run: tofu validate

      - name: tofu plan
        if: github.event.inputs.action == 'plan'
        run: tofu plan

      # apply/destroy ohne weitere Bestaetigung: bewusst, da der Workflow selbst schon
      # manuell per "Run workflow" mit einer gewaehlten Aktion gestartet werden muss.
      - name: tofu apply
        if: github.event.inputs.action == 'apply'
        run: tofu apply -auto-approve

      - name: tofu destroy
        if: github.event.inputs.action == 'destroy'
        run: tofu destroy -auto-approve

      - name: Outputs anzeigen
        if: github.event.inputs.action != 'destroy'
        run: tofu output
