name: Coverage Gate

# Nur bei Pull Requests (oeffnen/aktualisieren) oder manuell:
# Coverage des Branches darf nicht tiefer sein als die von main.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # fuer den PR-Kommentar (Bonus)
  packages: read # zum Pullen des DevContainer-Images aus der GHCR

jobs:
  devcontainer:
    uses: ./.github/workflows/devcontainer-image.yml

  gate:
    needs: devcontainer
    runs-on: ubuntu-latest
    # Laeuft im eigenen DevContainer-Image (Java 25 + Gradle) aus der GHCR
    container:
      image: ${{ needs.devcontainer.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4

      - name: main in Unterordner holen
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch

      # main wird mit der Daemon-JVM-Konfiguration des Branches gebaut,
      # damit Gradle das JDK aus dem DevContainer verwendet (und kein eigenes herunterlaedt)
      - name: Build-Umgebung fuer main angleichen
        run: cp gradle/gradle-daemon-jvm.properties main-branch/gradle/gradle-daemon-jvm.properties

      # Coverage des Branches bzw. Pull Requests
      - name: Coverage des Branches
        run: |
          chmod +x gradlew
          ./gradlew clean test jacocoTestReport
          BRANCH_COV=$(bash scripts/coverage.sh)
          echo "BRANCH_COV=$BRANCH_COV" >> "$GITHUB_ENV"

      # Coverage von main (Init-Script aktiviert JaCoCo auch falls main es noch nicht hat)
      - name: Coverage von main
        run: |
          cd main-branch
          chmod +x gradlew
          ./gradlew clean test jacocoTestReport --init-script ../scripts/jacoco-init.gradle
          MAIN_COV=$(bash ../scripts/coverage.sh build/reports/jacoco/test/jacocoTestReport.xml)
          echo "MAIN_COV=$MAIN_COV" >> "$GITHUB_ENV"

      # Beide Werte vergleichen
      - name: Vergleichen
        run: |
          DIFF=$(awk "BEGIN { printf \"%+.1f\", ${BRANCH_COV} - ${MAIN_COV} }")
          if awk "BEGIN { exit (${BRANCH_COV} >= ${MAIN_COV}) ? 0 : 1 }"; then
            RESULT=PASS
          else
            RESULT=FAIL
          fi
          echo "DIFF=$DIFF" >> "$GITHUB_ENV"
          echo "RESULT=$RESULT" >> "$GITHUB_ENV"

          echo "main:       ${MAIN_COV} %"
          echo "Branch:     ${BRANCH_COV} %"
          echo "Differenz:  ${DIFF} Prozentpunkte"
          echo "Ergebnis:   ${RESULT}"

          {
            echo "### Coverage Gate"
            echo ""
            echo "| | Coverage |"
            echo "|---|---|"
            echo "| main | ${MAIN_COV} % |"
            echo "| Branch | ${BRANCH_COV} % |"
            echo "| Differenz | ${DIFF} Prozentpunkte |"
            echo ""
            echo "**Ergebnis: ${RESULT}**"
          } >> "$GITHUB_STEP_SUMMARY"

      # Bonus: Ergebnis als Kommentar im Pull Request (bestehenden Kommentar aktualisieren)
      - name: Ergebnis als PR-Kommentar
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- coverage-gate -->';
            const body = [
              marker,
              '```',
              'Test Coverage',
              '',
              `main:       ${process.env.MAIN_COV} %`,
              `PR:         ${process.env.BRANCH_COV} %`,
              `Änderung:   ${process.env.DIFF} Prozentpunkte`,
              '',
              process.env.RESULT === 'PASS'
                ? 'PASS - Coverage Gate bestanden'
                : 'FAIL - Coverage Gate nicht bestanden',
              '```',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      # Gate: fehlschlagen, wenn der Branch weniger Coverage hat als main
      - name: Gate durchsetzen
        run: |
          echo "main: ${MAIN_COV} %  |  Branch: ${BRANCH_COV} %  |  ${DIFF} Prozentpunkte  ->  ${RESULT}"
          [ "$RESULT" = "PASS" ] || exit 1
