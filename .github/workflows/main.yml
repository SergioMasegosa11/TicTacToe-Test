name: CI/CD

on:
  push:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/tictactoe-test:latest \
            .

      - name: Run Tests and JaCoCo
        run: |
          docker run --name tictactoe-test \
            ghcr.io/${{ github.repository_owner }}/tictactoe-test:latest \
            ./gradlew clean test jacocoTestReport

      - name: Copy JaCoCo report
        run: docker cp tictactoe-test:/workspace/build/reports/jacoco/test/html ./jacoco-report

      - name: Remove test container
        run: docker rm tictactoe-test

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: jacoco-report/

      - name: Push Docker image
        run: docker push ghcr.io/${{ github.repository_owner }}/tictactoe-test:latest