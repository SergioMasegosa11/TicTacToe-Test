name: CI/CD

on:
  push:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/tictactoe-test:latest \

            .

      - name: Run Tests
        run: |
          docker run --rm ghcr.io/${{ github.repository_owner }}/tictactoe-test:latest \

            ./gradlew clean test

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/tictactoe-test:latest

