plugins {
    id 'java'
    id 'jacoco'
    id 'info.solidsoft.pitest' version '1.19.0' // Mutation Testing mit PIT (https://pitest.org/)
}

// Die Version steht in gradle.properties (version=X.Y.Z) und wird fuer JAR-Name und Manifest verwendet
group = 'ch.bbw.m450'

// Kompiliert wird mit Java 25, erzeugt wird Bytecode fuer Java 21,
// damit das Release-JAR auch mit einer Java-21-Runtime startet
tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
    mavenCentral()
}

// End-to-End-Tests liegen getrennt von den Unit-Tests in src/e2eTest/java
sourceSets {
    e2eTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    e2eTestImplementation.extendsFrom testImplementation
    e2eTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.27.3'
    testImplementation 'org.junit-pioneer:junit-pioneer:2.3.0' // @StdIo, @CartesianTest, @Issue, @SetSystemProperty (auch fuer e2eTest)
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport // Report immer nach den Tests erzeugen
}

// Eigener Task fuer die E2E-Tests: ./gradlew e2eTest (laeuft auch bei ./gradlew check / build)
tasks.register('e2eTest', Test) {
    description = 'Fuehrt die End-to-End-Tests (kompletter Spielablauf ueber stdin/stdout) aus.'
    group = 'verification'
    testClassesDirs = sourceSets.e2eTest.output.classesDirs
    classpath = sourceSets.e2eTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter test
}

tasks.named('check') {
    dependsOn tasks.named('e2eTest')
}

// Ausfuehrbares JAR: build/libs/tictactest-<version>.jar, startbar mit "java -jar"
jar {
    archiveBaseName = 'tictactest'
    manifest {
        attributes(
                'Main-Class': 'ch.bbw.m450.tictactoe.TicTacToeMain',
                'Implementation-Title': 'TicTacTest',
                'Implementation-Version': project.version
        )
    }
}

jacoco {
    toolVersion = "0.8.14"
}

// Mutation Testing: ./gradlew pitest -> Report in build/reports/pitest/index.html
pitest {
    pitestVersion = '1.30.0'
    junit5PluginVersion = '1.2.3'
    targetClasses = ['ch.bbw.m450.tictactoe.*']
    targetTests = ['ch.bbw.m450.tictactoe.*']
    mutators = ['STRONGER']
    threads = 4
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
    // Build schlaegt fehl, wenn zu viele Mutanten ueberleben
    mutationThreshold = 90
    coverageThreshold = 90
}

jacocoTestReport {
    dependsOn test

    reports {
        xml.required.set(true)  // XML: wird von den Coverage-Workflows ausgelesen
        html.required.set(true) // HTML: menschlich lesbarer Report
    }
}
