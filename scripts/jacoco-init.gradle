// Init-Script fuer das Coverage-Gate (nur fuer die Messung von main):
// aktiviert JaCoCo inkl. XML-Report, auch wenn main JaCoCo (noch) nicht im build.gradle hat.
// Fehlschlagende Tests auf main sollen die Messung nicht verhindern.
allprojects {
    apply plugin: 'java'
    apply plugin: 'jacoco'

    tasks.withType(Test).configureEach {
        ignoreFailures = true
    }

    tasks.withType(JacocoReport).configureEach {
        dependsOn tasks.named('test')
        reports {
            xml.required.set(true)
        }
    }
}
